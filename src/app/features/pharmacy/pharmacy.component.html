<div class="page-container">
  <div class="page-header">
    <div>
      <h1>Pharmacy & Inventory</h1>
      <p class="subtitle">Track stock quantities, expiry dates, and dispense medication</p>
    </div>
  </div>

  <div class="table-card">
    @if (isLoading()) {
      <div class="loading-state">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading pharmacy inventory...</p>
      </div>
    } @else {
      <table mat-table [dataSource]="medicines()" class="custom-table">
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let m"><span class="code-badge">{{ m.code }}</span></td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Medicine Name</th>
          <td mat-cell *matCellDef="let m"><strong class="text-white">{{ m.name }}</strong></td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Category</th>
          <td mat-cell *matCellDef="let m">{{ m.category }}</td>
        </ng-container>

        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef>Stock</th>
          <td mat-cell *matCellDef="let m">
            <span [ngClass]="m.stockQuantity < 10 ? 'stock-low' : 'stock-ok'">
              {{ m.stockQuantity }} units
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Unit Price</th>
          <td mat-cell *matCellDef="let m">{{ m.unitPrice | currency }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    }
  </div>
</div>
